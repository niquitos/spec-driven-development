services:
  db:
    image: postgres:15-alpine
    container_name: tasktracker-db
    environment:
      POSTGRES_DB: tasktracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tasktracker-network
    restart: always

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: niquitos1985/tasktracker-api:latest
    container_name: tasktracker-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=tasktracker;Username=postgres;Password=postgres
    ports:
      - "5000:8080"
    depends_on: 
      - db
    networks:
      - tasktracker-network
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: niquitos1985/tasktracker-frontend:latest
    container_name: tasktracker-frontend
    environment:
      - VITE_API_URL=http://api:8080/api
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - tasktracker-network
    restart: always

networks:
  tasktracker-network:
    driver: bridge
    
volumes:
  postgres_data: